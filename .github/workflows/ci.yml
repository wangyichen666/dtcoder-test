name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          rustflags: ""
      - name: 格式检查
        run: cargo +stable fmt --all -- --check
      - name: 全量测试
        run: cargo +stable test --locked --all-targets
      - name: 严格 Clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Release 构建
        run: cargo +stable build --locked --release
      - name: 提交差异空白检查
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --check "$base" HEAD

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          rustflags: ""
      - name: Rust 1.88 全目标检查
        run: cargo +1.88.0 check --locked --all-targets

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""
      - name: macOS 全目标检查
        run: cargo +stable check --locked --all-targets
      - name: macOS 测试
        run: cargo +stable test --locked --all-targets

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web 测试
        run: node --test web/app.test.cjs
      - name: Web 语法检查
        run: node --check web/app.js

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88.0"
          command: check
